services:
  mysql:
    image: mysql:8.4
    container_name: kopring-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: kopring
      MYSQL_USER: kopring
      MYSQL_PASSWORD: kopring
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - kopring-mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: kopring-redis
    ports:
      - "6380:6379"

volumes:
  kopring-mysql-data:
