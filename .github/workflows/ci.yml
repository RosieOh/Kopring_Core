name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle 배포판과 의존성을 캐시한다
      - uses: gradle/actions/setup-gradle@v4

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      # Testcontainers 가 러너의 Docker 로 MySQL·Redis 를 띄운다
      - name: Test
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  # 교재: Markdown(docs/*.md)이 원본이고 HTML(docs/book)은 build.py 가 만든다. 둘이 어긋나면 실패한다
  book:
    name: book
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/book/requirements.txt

      - name: Install
        run: pip install -r docs/book/requirements.txt

      - name: Build and compare
        run: |
          python docs/book/build.py
          if [ -n "$(git status --porcelain -- docs/book)" ]; then
            git status --short -- docs/book
            echo "::error::교재 HTML 이 Markdown 과 다릅니다. docs/book/build.py 로 다시 만들어 함께 커밋하세요."
            exit 1
          fi
