# DB(MySQL) / Redis 접속 정보는 TestContainersConfig 의 @ServiceConnection 이 넣어준다
# 스키마는 운영과 똑같이 Flyway 가 만들고 Hibernate 는 validate 만 한다 → 마이그레이션과 엔티티가 어긋나면 테스트가 깨진다

jwt.secret=a29wcmluZy1jb3JlLXRlc3Qtc2VjcmV0LWtleS1mb3ItanVuaXQtb25seS0wMTIzNDU2Nzg5
jwt.access-token-expiration=30m
jwt.refresh-token-expiration=14d

# 알림 Outbox: 재시도를 바로 하고, 스케줄러는 꺼서 테스트가 직접 처리 시점을 정한다
notification.outbox.backoff=0s
notification.outbox.max-attempts=3
notification.outbox.scheduler.enabled=false

# 대기열 워커는 테스트에서 직접 호출한다 (스케줄러가 몰래 돌면 결과를 예측할 수 없다)
coupon.queue.scheduler.enabled=false

# Prometheus 수집 경로 노출 (ObservabilityTest 에서 확인)
management.endpoints.web.exposure.include=health,prometheus

# 대기열 SSE 상태 전송은 테스트에서 직접 호출한다
coupon.queue.stream.scheduler.enabled=false
