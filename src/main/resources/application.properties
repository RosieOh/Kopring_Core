spring.application.name=site
spring.profiles.default=local

spring.jpa.open-in-view=false

# 스키마는 Flyway(db/migration)가 만들고, Hibernate 는 엔티티와 스키마가 맞는지 검증만 한다
spring.jpa.hibernate.ddl-auto=validate

# 스케줄러 스레드: 대기열 워커, 알림 Outbox, 대기열 SSE. 기본값(1개)이면 알림 발송(외부 API)이 느려질 때 다른 작업까지 함께 밀린다.
spring.task.scheduling.pool.size=3

# 지표: 모든 지표에 애플리케이션 이름 태그를 붙이고, HTTP 응답 시간은 히스토그램으로 내보내 Prometheus 에서 p95 를 계산한다
management.metrics.tags.application=kopring-core
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Tomcat 스레드 지표 (부하 테스트 때 요청 스레드가 얼마나 바쁜지 본다)
server.tomcat.mbeanregistry.enabled=true
