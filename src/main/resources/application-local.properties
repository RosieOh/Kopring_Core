# docker compose up -d 로 띄운 MySQL / Redis 기준
spring.datasource.url=jdbc:mysql://localhost:3306/kopring?characterEncoding=UTF-8
spring.datasource.username=kopring
spring.datasource.password=kopring

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug

spring.data.redis.host=localhost
spring.data.redis.port=6380

# 로컬 전용 키. 운영에서는 반드시 환경변수(JWT_SECRET)로 주입한다.
jwt.secret=${JWT_SECRET:a29wcmluZy1jb3JlLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC1rZXktMjAyNg==}
jwt.access-token-expiration=30m
jwt.refresh-token-expiration=14d

# 카카오 알림톡 (Solapi). false 면 실제로 보내지 않고 로그만 남긴다.
# 실제 발송: biztalk.enabled=true 와 함께 아래 값을 환경변수로 넣는다. (키를 이 파일에 커밋하지 않는다)
biztalk.enabled=${BIZTALK_ENABLED:false}
biztalk.api-key=${BIZTALK_API_KEY:}
biztalk.api-secret=${BIZTALK_API_SECRET:}
biztalk.sender-number=${BIZTALK_SENDER_NUMBER:}
biztalk.pf-id=${BIZTALK_PF_ID:}
biztalk.coupon-issued-template-id=${BIZTALK_COUPON_ISSUED_TEMPLATE_ID:COUPON_ISSUED}

# 기동 시 자동 생성되는 로컬 관리자 계정 (LocalAdminInitializer)
admin.init.email=admin@kopring.local
admin.init.password=admin1234!

# Prometheus 가 가져갈 지표 경로 (docker compose --profile monitoring up -d)
management.endpoints.web.exposure.include=health,prometheus
