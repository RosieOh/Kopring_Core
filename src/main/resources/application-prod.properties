# 운영 프로필. 접속 정보와 비밀값은 기본값 없는 환경변수로만 받는다.
# 필수 값이 빠지면 ProdEnvironmentValidator 가 빠진 이름을 알려주며 기동을 멈춘다.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis 비밀번호는 여기 적지 않는다. ${REDIS_PASSWORD:} 처럼 쓰면 빈 문자열이 비밀번호로 들어가서
# 비밀번호 없는 Redis 에 Redisson 이 AUTH 를 보내 접속에 실패한다.
# 필요하면 SPRING_DATA_REDIS_PASSWORD 환경변수로 넣는다. (Spring 이 spring.data.redis.password 로 읽는다)

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:30m}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:14d}

# 실제 발송하려면 BIZTALK_ENABLED=true 와 키 값을 넣는다. (켜 놓고 키가 빠지면 기동 시 실패한다)
biztalk.enabled=${BIZTALK_ENABLED:false}
biztalk.api-key=${BIZTALK_API_KEY:}
biztalk.api-secret=${BIZTALK_API_SECRET:}
biztalk.sender-number=${BIZTALK_SENDER_NUMBER:}
biztalk.pf-id=${BIZTALK_PF_ID:}
biztalk.coupon-issued-template-id=${BIZTALK_COUPON_ISSUED_TEMPLATE_ID:COUPON_ISSUED}

# API 문서는 운영에서 노출하지 않는다
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health
